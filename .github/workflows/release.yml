name: Release

on:
  push:
    branches: [main]

# release-please needs to open/update its release PR and create releases.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Must match the trusted-publisher environment configured on npm.
    environment:
      name: npm
      url: https://www.npmjs.com/package/blitz-api-js
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing (no stored token).
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # Trusted Publishing (OIDC + provenance) requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Release-time drift gate: refuse to publish enums that are stale vs the
      # live prod spec. This is the ONE place that fetches the spec in CI (per-PR
      # `ci.yml` stays offline/hermetic). The generator retries transient blips
      # (3 attempts, 15s timeout); if the spec endpoint is down, re-run this job.
      # We diff only the rendered `src/types/enums.ts` (the shipped artifact, which
      # carries no spec metadata) so a pure upstream `info.version` bump with no
      # enum-value change doesn't spuriously fail the release.
      - name: Verify enums are in sync with the live API spec
        run: |
          pnpm gen:enums:fetch
          if ! git diff --quiet -- src/types/enums.ts; then
            echo "::error::Committed enums are stale vs the live spec (https://api.blitz-api.ai/openapi). Run \`pnpm gen:enums:fetch\`, commit src/types/enums.ts + openapi/enum-source.json, then re-release."
            git --no-pager diff -- src/types/enums.ts openapi/enum-source.json
            exit 1
          fi
          echo "Enums are in sync with the live spec."
      - run: pnpm build
      - run: npm publish --access public
